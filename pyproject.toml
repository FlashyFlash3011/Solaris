[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "solaris-rocm"
version = "0.2.0"
description = "Physics AI framework for AMD GPUs via ROCm — Solaris"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10,<3.13"
# Only what the library itself imports. torch is required but deliberately not
# pinned to a build: on AMD GPUs install a ROCm build of PyTorch *first* (see the
# README) so pip never replaces it with a generic wheel.
dependencies = [
    "torch>=2.4.0",
    "numpy>=1.24.0",
    "loguru>=0.7.0",
]

[project.optional-dependencies]
# HDF5Dataset
datapipes = ["h5py>=3.8.0"]
# plotting helpers used by the demos and benchmarks
viz = ["matplotlib>=3.7.0"]
# everything needed to run projects/ and examples/ (FD solvers + figures)
demos = ["scipy>=1.10.0", "matplotlib>=3.7.0"]
# HyperparameterTuner
tuning = ["optuna>=3.0.0"]
# WandbLogger
tracking = ["wandb>=0.15.0"]
# export_onnx (+ onnxruntime validation)
export = [
    "onnx>=1.14.0",
    "onnxruntime>=1.16.0",
    "onnxscript>=0.1.0",
]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
    "pre-commit>=3.3.0",
    "mypy>=1.8.0",
    "scipy>=1.10.0",
    "matplotlib>=3.7.0",
    "h5py>=3.8.0",
]

[project.entry-points."solaris.models"]
fno = "solaris.models.fno:FNO"
afno = "solaris.models.afno:AFNO"
mlp = "solaris.models.mlp:FullyConnected"
meshgraphnet = "solaris.models.meshgraphnet:MeshGraphNet"
wno = "solaris.models.wno:WNO"
uno = "solaris.models.uno:UNO"
deeponet = "solaris.models.deeponet:DeepONet"
constrained_fno = "solaris.models.constrained_fno:ConstrainedFNO"
multiscale_fno = "solaris.models.multiscale_fno:MultiScaleFNO"
coupled_operator = "solaris.models.coupled:CoupledOperator"
conformal = "solaris.models.conformal:ConformalNeuralOperator"
residual_corrector = "solaris.models.residual_corrector:NeuralResidualCorrector"

[tool.hatch.build.targets.wheel]
packages = ["solaris"]

[tool.hatch.build.targets.sdist]
include = ["solaris", "tests", "examples"]

[[tool.uv.index]]
name = "rocm"
url = "https://download.pytorch.org/whl/rocm6.2"
explicit = true

[tool.uv.sources]
torch = [{ index = "rocm" }]
torchvision = [{ index = "rocm" }]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=solaris --cov-report=term-missing"
filterwarnings = [
    # Older tests deliberately exercise the legacy norm default
    "ignore:.*norm was not specified:solaris.exceptions.FutureFeatureWarning",
]
